<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naura Property — PT. Naura Lathisa Sejahtera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --glossy-navy-deep: #040e1c;
      --glossy-navy-mid: #081e3b;
      --text-primary: #f8fafc;
      --text-muted: #93c5fd;
      --glass: rgba(8, 28, 54, 0.84);
      --glass-dark: rgba(5, 16, 31, 0.95);
      --line: rgba(147, 197, 253, 0.24);
      --accent-cyan: #38bdf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.24), transparent 42%),
        radial-gradient(circle at 82% 88%, rgba(37, 99, 235, 0.28), transparent 48%),
        linear-gradient(145deg, var(--glossy-navy-deep) 0%, var(--glossy-navy-mid) 55%, var(--glossy-navy-deep) 100%);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      color: #ffffff;
    }

    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    .submenu-box::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 5px; }
    .submenu-box::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track { background: rgba(5, 18, 36, 0.45); border-radius: 999px; }
    .submenu-box::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.42); border-radius: 999px; }

    /* ==================== LAYAR LOGIN & REGISTER TEMA PERUMAHAN ==================== */
    .auth-stage {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(4, 15, 30, 0.56) 0%, rgba(5, 22, 45, 0.4) 45%, rgba(3, 12, 24, 0.9) 100%),
        linear-gradient(160deg, #0b294d 0%, #071b33 52%, #041020 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .housing-scene { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .housing-sky-glow { position: absolute; top: -12%; left: 50%; transform: translateX(-50%); width: 110%; height: 55%; background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.28) 0%, rgba(37, 99, 235, 0.12) 55%, transparent 75%); }
    .housing-road { position: absolute; left: -10%; right: -10%; bottom: 0; height: 22%; background: linear-gradient(180deg, #0b1b30 0%, #050d18 100%); border-top: 1px solid rgba(147, 197, 253, 0.22); }
    .housing-road-line { position: absolute; left: 0; right: 0; bottom: 10%; height: 2px; background: repeating-linear-gradient(90deg, rgba(186, 230, 253, 0.45) 0px, rgba(186, 230, 253, 0.45) 28px, transparent 28px, transparent 56px); }
    .housing-lawn { position: absolute; left: -10%; right: -10%; bottom: 20%; height: 16%; background: linear-gradient(180deg, rgba(14, 116, 144, 0.22) 0%, rgba(6, 36, 66, 0.55) 100%); }

    .house-unit { position: absolute; bottom: 24%; border: 1px solid rgba(186, 230, 253, 0.22); background: linear-gradient(180deg, rgba(13, 41, 77, 0.86), rgba(5, 18, 36, 0.94)); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); }
    .house-unit::before { content: ""; position: absolute; left: -6%; right: -6%; top: -22px; height: 24px; background: linear-gradient(135deg, rgba(56, 189, 248, 0.36), rgba(15, 52, 96, 0.92)); border: 1px solid rgba(186, 230, 253, 0.28); clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); }
    .house-win { position: absolute; background: rgba(125, 211, 252, 0.28); border: 1px solid rgba(186, 230, 253, 0.35); border-radius: 2px; }

    .house-1 { left: 4%; width: 140px; height: 96px; }
    .house-1 .w1 { top: 22px; left: 16px; width: 36px; height: 28px; }
    .house-1 .w2 { top: 22px; right: 16px; width: 36px; height: 28px; }
    .house-1 .door { bottom: 0; left: 54px; width: 30px; height: 42px; background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(186, 230, 253, 0.3); }

    .house-2 { left: 18%; width: 170px; height: 122px; }
    .house-2 .w1 { top: 20px; left: 18px; width: 54px; height: 32px; }
    .house-2 .w2 { top: 20px; right: 18px; width: 54px; height: 32px; }
    .house-2 .w3 { bottom: 18px; left: 18px; width: 42px; height: 28px; }
    .house-2 .door { bottom: 0; right: 32px; width: 34px; height: 48px; background: rgba(56, 189, 248, 0.22); border: 1px solid rgba(186, 230, 253, 0.32); }

    .house-3 { right: 19%; width: 165px; height: 114px; }
    .house-3 .w1 { top: 22px; left: 20px; width: 48px; height: 30px; }
    .house-3 .w2 { top: 22px; right: 20px; width: 48px; height: 30px; }
    .house-3 .door { bottom: 0; left: 66px; width: 32px; height: 44px; background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(186, 230, 253, 0.3); }

    .house-4 { right: 4%; width: 138px; height: 92px; }
    .house-4 .w1 { top: 20px; left: 16px; width: 42px; height: 26px; }
    .house-4 .w2 { top: 20px; right: 16px; width: 42px; height: 26px; }

    .tree-cluster { position: absolute; bottom: 24%; width: 26px; height: 46px; background: radial-gradient(circle at 50% 35%, rgba(56, 189, 248, 0.35), rgba(14, 116, 144, 0.55)); border-radius: 50% 50% 40% 40%; border: 1px solid rgba(186, 230, 253, 0.2); }
    .tree-1 { left: 14.5%; }
    .tree-2 { left: 32%; width: 32px; height: 54px; }
    .tree-3 { right: 33%; width: 30px; height: 50px; }
    .tree-4 { right: 15%; }

    .login-box {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
      background: linear-gradient(160deg, rgba(10, 31, 61, 0.92), rgba(4, 14, 28, 0.96));
      border: 1px solid rgba(147, 197, 253, 0.28);
      border-radius: 16px;
      padding: 28px 26px;
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      animation: cardEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(4, 15, 30, 0.8);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 18px;
    }

    .auth-tab {
      border: 0;
      background: transparent;
      color: #cbd5e1;
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      color: #ffffff;
    }

    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .login-logo { width: 46px; height: 46px; border-radius: 11px; background: #ffffff; border: 1px solid rgba(186, 230, 253, 0.4); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }

    .field-group { margin-bottom: 14px; }
    .field-group label { display: block; font-size: 12px; font-weight: 600; color: #f1f5f9; margin-bottom: 6px; }
    .field-input, .field-select {
      width: 100%;
      height: 41px;
      background: linear-gradient(180deg, rgba(15, 42, 78, 0.9), rgba(8, 23, 45, 0.96));
      border: 1px solid rgba(147, 197, 253, 0.26);
      border-radius: 9px;
      padding: 0 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .field-select option { background: #071b33; color: #ffffff; }
    .field-input:focus, .field-select:focus { border-color: var(--accent-cyan); }
    .field-input::placeholder { color: rgba(186, 230, 253, 0.55); }

    .login-submit {
      width: 100%;
      height: 42px;
      margin-top: 6px;
      border: 1px solid rgba(186, 230, 253, 0.35);
      border-radius: 9px;
      background: linear-gradient(180deg, #0284c7 0%, #1d4ed8 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(29, 78, 216, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .login-submit:hover { filter: brightness(1.08); transform: translateY(-1px); }

    /* ==================== WORKSPACE ==================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.2), transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(37, 99, 235, 0.24), transparent 42%),
        linear-gradient(155deg, #030b16 0%, #071930 55%, #041020 100%);
    }

    .sidebar {
      width: 264px;
      flex: 0 0 264px;
      background: var(--glass-dark);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(20px);
      padding: 18px 14px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-behavior: smooth;
      transition: transform 0.25s ease;
    }

    .brand-box { display: flex; align-items: center; gap: 11px; padding: 4px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 10px; background: #ffffff; border: 1px solid rgba(186, 230, 253, 0.35); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 3px;
      flex-shrink: 0;
      transition: background 0.18s ease, transform 0.18s ease;
    }
    .nav-item-btn:hover { background: rgba(56, 189, 248, 0.12); transform: translateX(3px); }
    .nav-item-btn.active { background: linear-gradient(95deg, rgba(29, 78, 216, 0.78), rgba(56, 189, 248, 0.28)); border: 1px solid rgba(147, 197, 253, 0.25); }

    .submenu-box {
      max-height: 164px;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 6px 8px 6px 10px;
      margin-bottom: 8px;
      border-left: 1px solid rgba(147, 197, 253, 0.22);
      border-radius: 0 8px 8px 0;
      background: rgba(4, 15, 29, 0.35);
      animation: submenuSlide 0.22s ease;
    }

    @keyframes submenuSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .role-warning-box {
      background: rgba(220, 38, 38, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.45);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: #fecaca;
      line-height: 1.45;
    }

    .sub-btn {
      width: 100%;
      text-align: left;
      border: 0;
      background: rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 3px;
      transition: background 0.16s ease, transform 0.16s ease;
    }
    .sub-btn:last-child { margin-bottom: 0; }
    .sub-btn:hover { background: rgba(56, 189, 248, 0.14); transform: translateX(3px); color: #ffffff; }
    .sub-btn.active { background: rgba(56, 189, 248, 0.28); color: #ffffff; font-weight: 700; }

    .side-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
    .user-box { background: rgba(12, 37, 71, 0.75); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }

    .main-area { margin-left: 264px; width: calc(100% - 264px); padding: 22px 26px 46px; min-width: 0; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: linear-gradient(150deg, rgba(12, 38, 74, 0.88), rgba(6, 20, 40, 0.92));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .btn {
      border: 1px solid rgba(186, 230, 253, 0.28);
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      color: #ffffff;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.16s ease, filter 0.16s ease;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:active { transform: scale(0.97); }
    .btn.green { background: linear-gradient(135deg, #16a34a, #15803d); border-color: rgba(187, 247, 208, 0.25); }
    .btn.ghost { background: rgba(15, 43, 82, 0.72); }
    .btn.danger { background: linear-gradient(135deg, #dc2626, #991b1b); border-color: rgba(254, 202, 202, 0.25); }
    .btn.sm { padding: 5px 9px; font-size: 11px; border-radius: 7px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat-card { background: linear-gradient(155deg, rgba(12, 38, 74, 0.86), rgba(5, 17, 34, 0.92)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; backdrop-filter: blur(16px); }
    .stat-val { font-size: 19px; font-weight: 800; margin-top: 8px; color: #ffffff; }

    .panel { background: linear-gradient(155deg, rgba(11, 35, 68, 0.85), rgba(5, 17, 34, 0.92)); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 18px; backdrop-filter: blur(16px); }
    .reveal-item { opacity: 0; transform: translateY(16px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    .reveal-item.in-view { opacity: 1; transform: translateY(0); }

    .panel-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; margin-bottom: 6px; color: #ffffff; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: rgba(5, 18, 36, 0.88);
      border: 1px solid rgba(147, 197, 253, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent-cyan); }
    .full { grid-column: 1 / -1; }
    .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

    .table-wrap { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); background: rgba(4, 15, 29, 0.78); }
    table { width: 100%; border-collapse: collapse; min-width: 680px; font-size: 12px; }
    th { text-align: left; padding: 10px 12px; background: rgba(56, 189, 248, 0.14); border-bottom: 1px solid var(--line); font-size: 11px; text-transform: uppercase; color: #ffffff; }
    td { padding: 9px 12px; border-bottom: 1px solid rgba(147, 197, 253, 0.1); color: #ffffff; vertical-align: middle; }

    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .summary-box { background: rgba(5, 18, 36, 0.78); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(56, 189, 248, 0.24); border: 1px solid rgba(186, 230, 253, 0.25); }
    .badge.ok { background: rgba(22, 163, 74, 0.35); }
    .badge.warn { background: rgba(239, 68, 68, 0.35); }

    /* Modal Form Terpisah */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(2, 9, 19, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-card {
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(160deg, rgba(11, 35, 68, 0.96), rgba(5, 17, 34, 0.98));
      border: 1px solid rgba(147, 197, 253, 0.32);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.7);
    }

    .mobile-bar { display: none; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 10px 14px; background: var(--glass-dark); border: 1px solid var(--line); border-radius: 12px; }

    /* Kop Surat PDF / Cetak */
    .print-header {
      display: none;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2.5px solid #b91c1c;
    }

    .kop-flex {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .kop-title {
      font-size: 18px;
      font-weight: 800;
      color: #b91c1c;
      letter-spacing: 0.4px;
    }

    .director-sign {
      display: none;
      margin-top: 26px;
      padding-top: 12px;
      border-top: 1px dashed #334155;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 120; background: #092547; border: 1px solid rgba(147, 197, 253, 0.45); color: #ffffff; border-radius: 12px; padding: 12px 16px; font-size: 12.5px; font-weight: 600; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55); }

    @media (max-width: 980px) { .stats-grid, .two-col { grid-template-columns: 1fr; } }
    @media (max-width: 820px) {
      .mobile-bar { display: flex; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-area { margin-left: 0; width: 100%; padding: 14px 14px 40px; }
      .form-grid { grid-template-columns: 1fr; }
    }

    @media print {
      * { color: #111827 !important; background: transparent !important; box-shadow: none !important; }
      body { background: #ffffff !important; }
      .sidebar, .topbar, .mobile-bar, .no-print, .toast, .auth-stage, .modal-backdrop { display: none !important; }
      .main-area { margin: 0 !important; width: 100% !important; padding: 0 !important; }
      .panel { border: 1px solid #cbd5e1 !important; }
      table, th, td { border: 1px solid #94a3b8 !important; }
      .print-header { display: block !important; }
      .kop-title { color: #b91c1c !important; }
      .director-sign { display: flex !important; }
    }
  </style>
</head>

  <!-- ==================== HALAMAN LOGIN & REGISTER ==================== -->
  <section id="authView" class="auth-stage">
    <div class="housing-scene">
      <div class="housing-sky-glow"></div>
      <div class="housing-lawn"></div>
      <div class="housing-road"></div>
      <div class="housing-road-line"></div>
      <div class="house-unit house-1"><span class="house-win w1"></span><span class="house-win w2"></span><span class="door"></span></div>

      <div class="tree-cluster tree-1"></div>

    function hashPass(str) {
      let h = 2166136261;
      const s = String(str || '');
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return 'P_' + (h >>> 0).toString(16);
    }

    let DB = loadDB();
    let USER = null;
    let ACTIVE_VIEW = 'Dashboard';
    let chartInstance = null;

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (!raw) {
          const d = initialDB();
          localStorage.setItem(DB_KEY, JSON.stringify(d));
          return d;
        }
        const p = JSON.parse(raw);
        const def = initialDB();
        return Object.assign({}, def, p, {
          meta: Object.assign({}, def.meta, p.meta || {}, {
            pdf: Object.assign({}, def.meta.pdf, (p.meta && p.meta.pdf) || {})
          })
        });
      } catch (e) {
        return initialDB();
      }
    }

    function esc(v) {
      return String(v === null || v === undefined ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    function handleLogin(ev) {
      ev.preventDefault();
      const uname = document.getElementById('loginUsername').value.trim().toLowerCase();
      const pass = document.getElementById('loginPassword').value;
      const hp = hashPass(pass);

      const found = (DB.users || []).find(u =>
        u.username.toLowerCase() === uname &&
        (u.password === hp || u.password === pass)

      if (!found) return showToast('Username atau password tidak sesuai.');
      enterApp(found);

    function handleRegister(ev) {
      ev.preventDefault();
      const nama = document.getElementById('regNama').value.trim();
      const username = document.getElementById('regUsername').value.trim();

      const pass = document.getElementById('regPassword').value;

      if (!nama || !username || !pass) return showToast('Lengkapi semua kolom pendaftaran.');
      const exists = (DB.users || []).some(u => u.username.toLowerCase() === username.toLowerCase());
      if (exists) return showToast('Username sudah dipakai.');

      const newUser = {
        id: 'U-' + Date.now(),
        nama,
        username,
        password: hashPass(pass),
        role: divisi

      DB.users.push(newUser);
      saveDB();
      pushCloud('register', { user: newUser });
      showToast('Akun divisi ' + divisi + ' berhasil dibuat.');

    /* ==================== KALKULASI KEUANGAN & NERACA ==================== */
    function calcFinance() {
      const accs = DB.accounts || [];
      const jurnals = DB.journals || [];
      const kas = DB.cashFlows || [];

      const ledger = accs.map(a => {
        const rows = jurnals.filter(j => String(j.kodeAkun) === String(a.kode));
        const debit = rows.reduce((s, x) => s + (Number(x.debit) || 0), 0);
        const kredit = rows.reduce((s, x) => s + (Number(x.kredit) || 0), 0);
        const saldo = a.normal === 'Kredit' ? (kredit - debit) : (debit - kredit);
        return { kode: a.kode, nama: a.nama, kategori: a.kategori, normal: a.normal, debit, kredit, saldo };
      });

      const totalDebit = jurnals.reduce((s, x) => s + (Number(x.debit) || 0), 0);
      const totalKredit = jurnals.reduce((s, x) => s + (Number(x.kredit) || 0), 0);

      const aktiva = ledger.filter(x => x.kategori === 'AKTIVA');
      const pasiva = ledger.filter(x => x.kategori === 'PASIVA');
      const pendapatan = ledger.filter(x => x.kategori === 'PENDAPATAN');
      const beban = ledger.filter(x => x.kategori === 'BEBAN');

      const totalPendapatan = pendapatan.reduce((s, x) => s + x.saldo, 0);
      const totalBeban = beban.reduce((s, x) => s + x.saldo, 0);
      const labaBersih = totalPendapatan - totalBeban;

      const totalAktiva = aktiva.reduce((s, x) => s + x.saldo, 0);
      const totalPasivaAkun = pasiva.reduce((s, x) => s + x.saldo, 0);
      const totalPasiva = totalPasivaAkun + labaBersih;

      const kasMasuk = kas.filter(k => k.jenis === 'IN').reduce((s, k) => s + (Number(k.nominal) || 0), 0);
      const kasKeluar = kas.filter(k => k.jenis === 'OUT').reduce((s, k) => s + (Number(k.nominal) || 0), 0);

      return {
        ledger, totalDebit, totalKredit,
        jurnalSeimbang: Math.abs(totalDebit - totalKredit) < 0.01,
        aktiva, pasiva, pendapatan, beban,
        totalPendapatan, totalBeban, labaBersih,
        totalAktiva, totalPasivaAkun, totalPasiva,
        selisihNeraca: totalAktiva - totalPasiva,
        neracaSeimbang: Math.abs(totalAktiva - totalPasiva) < 0.01,
        kasMasuk, kasKeluar, saldoKas: kasMasuk - kasKeluar
      };
    }

    function renderView() {
      const body = document.getElementById('pageBody');

        body.innerHTML = `

      const fin = calcFinance();

        'Dashboard': () => viewDashboard(fin),
        'Transaksi Kas': () => viewTransaksiKas(),
        'Jurnal Umum': () => viewJurnalUmum(),
        'Arus Kas': () => viewArusKas(fin),
        'Neraca': () => viewNeraca(fin),
        'Laba Rugi': () => viewLabaRugi(fin),
        'Buku Besar': () => viewBukuBesar(fin),
        'Kredit & Debit': () => viewKreditDebit(fin),
        'Data KPR': () => viewDataKPR(),
        'Piutang KPR': () => viewPiutangKPR(),
        'Karyawan': () => viewKaryawan(),
        'Template PDF': () => viewTemplatePDF(),
        'Database': () => viewDatabase(fin),
        'Pengguna': () => viewPengguna()
      };

      body.innerHTML = (views[ACTIVE_VIEW] || (() => viewDashboard(fin)))();

      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      if (ACTIVE_VIEW === 'Dashboard' && canViewFinance()) buildChart(fin);

      bindScrollReveal();
    }

    function bindScrollReveal() {
      if (observer) observer.disconnect();
      const targets = document.querySelectorAll('.panel, .stat-card');
      targets.forEach(t => t.classList.add('reveal-item'));
      observer = new IntersectionObserver((entries) => {
        entries.forEach(en => { if (en.isIntersecting) en.target.classList.add('in-view'); });
      }, { threshold: 0.06 });
      targets.forEach(t => observer.observe(t));
    }

    function saveKasModal(ev, editId) {
      ev.preventDefault();
      if (!canEditFinance()) return showToast('Tidak ada hak edit keuangan.');
      const tanggal = document.getElementById('mKasTgl').value || today();
      const jenis = document.getElementById('mKasJenis').value;
      const kategori = document.getElementById('mKasKat').value;
      const bukti = (document.getElementById('mKasBukti').value || '').trim() || ('NLS-' + Date.now().toString().slice(-5));
      const pihak = (document.getElementById('mKasPihak').value || '').trim();
      const nominal = Number(document.getElementById('mKasNom').value) || 0;
      const akunKas = document.getElementById('mKasAkun').value;
      const akunLawan = document.getElementById('mKasLawan').value;
      const keterangan = (document.getElementById('mKasKet').value || '').trim();
      if (nominal <= 0) return showToast('Nominal harus lebih dari 0.');

      const map = {};
      (DB.accounts || []).forEach(a => { map[a.kode] = a.nama; });

      if (editId) {
        const old = (DB.cashFlows || []).find(x => x.id === editId);
        if (old && old.bukti) {
          DB.journals = (DB.journals || []).filter(j => j.bukti !== old.bukti);
        }
        DB.cashFlows = (DB.cashFlows || []).map(x => x.id === editId
          ? { id: editId, tanggal, jenis, kategori, bukti, pihak, akunKas, akunLawan, nominal, keterangan }
          : x
        );
      } else {
        DB.cashFlows.push({ id: 'CF-' + Date.now(), tanggal, jenis, kategori, bukti, pihak, akunKas, akunLawan, nominal, keterangan });
      }

      if (jenis === 'IN') {
        DB.journals.push(
          { id: 'J-' + Date.now() + '-1', tanggal, bukti, keterangan, kodeAkun: akunKas, namaAkun: map[akunKas] || akunKas, debit: nominal, kredit: 0 },
          { id: 'J-' + Date.now() + '-2', tanggal, bukti, keterangan, kodeAkun: akunLawan, namaAkun: map[akunLawan] || akunLawan, debit: 0, kredit: nominal }
        );
      } else {
        DB.journals.push(
          { id: 'J-' + Date.now() + '-1', tanggal, bukti, keterangan, kodeAkun: akunLawan, namaAkun: map[akunLawan] || akunLawan, debit: nominal, kredit: 0 },
          { id: 'J-' + Date.now() + '-2', tanggal, bukti, keterangan, kodeAkun: akunKas, namaAkun: map[akunKas] || akunKas, debit: 0, kredit: nominal }
        );
      }

      saveDB();
      pushCloud('saveKas', { bukti, jenis, nominal });
      closeModal();
      showToast(editId ? 'Transaksi kas diperbarui.' : 'Transaksi kas ditambahkan.');
      renderView();
    }

    function deleteKas(id) {
      if (!canEditFinance()) return showToast('Tidak ada hak hapus keuangan.');
      const target = (DB.cashFlows || []).find(x => x.id === id);
      if (target && target.bukti) {

      }
      DB.cashFlows = (DB.cashFlows || []).filter(x => x.id !== id);
      saveDB();
      showToast('Transaksi kas dihapus.');
      renderView();
    }

    function pasteExcelKasModal() {
      const raw = (document.getElementById('mExcelBox').value || '').trim();
      if (!raw) return showToast('Tempelkan data Excel terlebih dahulu.');
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let n = 0;
      lines.forEach(line => {
        const sep = line.includes('\t') ? '\t' : ',';
        const p = line.split(sep).map(x => x.trim());
        const nominal = Number(String(p[5] || 0).replace(/[^\d.-]/g, '')) || 0;
        if (nominal > 0) {
          const tanggal = p[0] || today();
          const jenis = (p[1] || 'IN').toUpperCase() === 'OUT' ? 'OUT' : 'IN';
          const kategori = (p[2] || 'OPERASIONAL').toUpperCase();
          const bukti = p[3] || ('EX-' + Date.now().toString().slice(-4) + '-' + (++n));
          const pihak = p[4] || 'Excel';
          const keterangan = p[6] || 'Posting Excel';
          DB.cashFlows.push({ id: 'CF-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5), tanggal, jenis, kategori, bukti, pihak, akunKas: '1101', akunLawan: jenis === 'IN' ? '4101' : '5202', nominal, keterangan });
          DB.journals.push(
            { id: 'J-' + Math.random().toString(36).slice(2, 8), tanggal, bukti, keterangan, kodeAkun: jenis === 'IN' ? '1101' : '5202', namaAkun: jenis === 'IN' ? 'Kas Operasional' : 'Beban Operasional & Gaji', debit: nominal, kredit: 0 },
            { id: 'J-' + Math.random().toString(36).slice(2, 8), tanggal, bukti, keterangan, kodeAkun: jenis === 'IN' ? '4101' : '1101', namaAkun: jenis === 'IN' ? 'Pendapatan Unit & KPR' : 'Kas Operasional', debit: 0, kredit: nominal }
          );
          n++;
        }
      });
      saveDB();
      closeModal();
      showToast(n + ' baris data Excel diposting.');
      renderView();
    }

        debit: Number(tr.querySelector('.j-deb').value) || 0,
        kredit: Number(tr.querySelector('.j-kre').value) || 0
      }));
      const td = lines.reduce((s, x) => s + x.debit, 0);

      if (lines.length < 2 || td <= 0 || Math.abs(td - tk) > 0.01) return showToast('Debit dan Kredit harus seimbang dan lebih dari 0.');
      const map = {};
      (DB.accounts || []).forEach(a => { map[a.kode] = a.nama; });
      lines.forEach(l => {
        DB.journals.push({ id: 'J-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5), tanggal, bukti, keterangan, kodeAkun: l.kode, namaAkun: map[l.kode] || l.kode, debit: l.debit, kredit: l.kredit });

      closeModal();
      showToast('Jurnal umum tersimpan.');

      DB.kpr.push({
        id: 'KPR-' + Date.now(),

    function openKprFieldModal(id, field) {
      if (!canEditKPR()) return showToast('Tidak ada hak edit KPR.');
      const item = (DB.kpr || []).find(x => x.id === id);
      if (!item) return;

      let inputHtml = '';
      let titleText = '';
      if (field === 'status') {
        titleText = 'Edit Status KPR — ' + item.customer;
        inputHtml = `<select id="mFieldVal"><option ${item.status === 'Proses' ? 'selected' : ''}>Proses</option><option ${item.status === 'ACC Bank' ? 'selected' : ''}>ACC Bank</option><option ${item.status === 'Akad' ? 'selected' : ''}>Akad</option><option ${item.status === 'Batal' ? 'selected' : ''}>Batal</option></select>`;
      } else if (field === 'slik') {
        titleText = 'Edit Hasil SLIK — ' + item.customer;
        inputHtml = `<select id="mFieldVal"><option value="" ${!item.slik ? 'selected' : ''}>Belum dicek</option><option value="Lancar (Col 1)" ${item.slik === 'Lancar (Col 1)' ? 'selected' : ''}>Lancar (Col 1)</option><option value="DPK (Col 2)" ${item.slik === 'DPK (Col 2)' ? 'selected' : ''}>DPK (Col 2)</option><option value="Kurang Lancar (Col 3)" ${item.slik === 'Kurang Lancar (Col 3)' ? 'selected' : ''}>Kurang Lancar (Col 3)</option><option value="Macet (Col 5)" ${item.slik === 'Macet (Col 5)' ? 'selected' : ''}>Macet (Col 5)</option></select>`;
      } else {
        titleText = 'Edit Keterangan — ' + item.customer;
        inputHtml = `<input id="mFieldVal" type="text" value="${esc(item.keterangan || '')}" placeholder="Isi keterangan">`;
      }

      openModal(`
        <div class="panel-head">
          <h3>${esc(titleText)}</h3>
          <button type="button" class="btn sm ghost" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="saveKprFieldModal(event, '${esc(id)}', '${esc(field)}')">
          <div class="form-group"><label>NILAI BARU</label>${inputHtml}</div>
          <div class="actions-bar">
            <button type="submit" class="btn green">Simpan Perubahan</button>
            <button type="button" class="btn ghost" onclick="closeModal()">Batal</button>
          </div>
        </form>`);
    }

    function saveKprFieldModal(ev, id, field) {
      ev.preventDefault();
      if (!canEditKPR()) return showToast('Tidak ada hak edit KPR.');
      const val = document.getElementById('mFieldVal').value;
      DB.kpr = (DB.kpr || []).map(x => {
        if (x.id !== id) return x;
        const copy = Object.assign({}, x);
        copy[field] = typeof val === 'string' ? val.trim() : val;
        return copy;
      });
      saveDB();
      closeModal();
      showToast('Data KPR diperbarui.');
      renderView();
    }

    function deleteKpr(id) {
      if (!canEditKPR()) return showToast('Tidak ada hak hapus KPR.');
      DB.kpr = (DB.kpr || []).filter(x => x.id !== id);
      saveDB();
      showToast('Data KPR dihapus.');
      renderView();
    }

    function savePiutangModal(ev, editId) {
      ev.preventDefault();
      if (!canEditFinance()) return showToast('Tidak ada hak akses.');
      const payload = {
        customer: (document.getElementById('mArCust').value || '').trim(),
        unit: (document.getElementById('mArUnit').value || '').trim(),
        total: Number(document.getElementById('mArTot').value) || 0,
        terbayar: Number(document.getElementById('mArByr').value) || 0
      };
      if (editId) {
        DB.receivables = (DB.receivables || []).map(x => x.id === editId ? Object.assign({}, x, payload) : x);
      } else {
        DB.receivables.push(Object.assign({ id: 'AR-' + Date.now() }, payload));
      }
      saveDB();
      closeModal();
      showToast('Piutang KPR tersimpan.');
      renderView();
    }

      if (!tb) return;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="a-nama" type="text" placeholder="Nama karyawan" required></td>
        <td><input class="a-div" type="text" placeholder="Divisi"></td>
        <td><input class="a-hadir" type="number" min="0" value="0"></td>
        <td><input class="a-izin" type="number" min="0" value="0"></td>
        <td><input class="a-sakit" type="number" min="0" value="0"></td>
        <td><button type="button" class="btn sm danger" onclick="this.closest('tr').remove()">×</button></td>`;
      tb.appendChild(tr);
    }

    function saveAbsensiModal(ev) {
      ev.preventDefault();
      if (!canEditKaryawan()) return showToast('Hanya Admin & Developer yang bisa mengubah menu Karyawan.');
      const periode = document.getElementById('mAbsPer').value || monthNow();
      const tanggal = document.getElementById('mAbsTgl').value || today();
      let count = 0;
      document.querySelectorAll('#mAbsensiRows tr').forEach(tr => {
        const nama = (tr.querySelector('.a-nama').value || '').trim();
        if (!nama) return;
        DB.attendance.push({
          id: 'ABS-' + Date.now() + '-' + (++count),
          periode, tanggal, nama,
          divisi: (tr.querySelector('.a-div').value || '').trim() || 'Operasional',
          hadir: Number(tr.querySelector('.a-hadir').value) || 0,
          izin: Number(tr.querySelector('.a-izin').value) || 0,
          sakit: Number(tr.querySelector('.a-sakit').value) || 0
        });
      });
      if (!count) return showToast('Isi minimal satu nama karyawan.');
      saveDB();
      closeModal();
      showToast(count + ' rekap absensi tersimpan.');
      renderView();
    }

    function deleteAbsensi(id) {
      if (!canEditKaryawan()) return showToast('Hanya Admin & Developer yang bisa mengubah menu Karyawan.');
      DB.attendance = (DB.attendance || []).filter(x => x.id !== id);
      saveDB();
      showToast('Rekap absensi dihapus.');
      renderView();
    }

    /* ==================== KOP SURAT & TEMPLATE PDF ==================== */
    function viewTemplatePDF() {
      const p = DB.meta.pdf || {};
      return `
        <div class="panel">
          <div class="panel-head"><div><h3>Pengaturan Kop Surat, Logo & ACC Direktur</h3></div></div>
          <form onsubmit="savePdfCfg(event)">
            <div class="form-grid">
              <div class="form-group">
                <label>UKURAN KERTAS</label>
                <select id="pdfPaper">
                  <option value="A4" ${p.paperSize === 'A4' ? 'selected' : ''}>A4</option>
                  <option value="F4" ${p.paperSize === 'F4' ? 'selected' : ''}>F4</option>
                  <option value="Letter" ${p.paperSize === 'Letter' ? 'selected' : ''}>Letter</option>
                </select>
              </div>
              <div class="form-group">
                <label>ORIENTASI</label>
                <select id="pdfOrient">
                  <option value="portrait" ${p.orientation === 'portrait' ? 'selected' : ''}>Potret</option>
                  <option value="landscape" ${p.orientation === 'landscape' ? 'selected' : ''}>Lanskap</option>
                </select>
              </div>
              <div class="form-group"><label>NAMA PERUSAHAAN (KOP)</label><input id="pdfTitle" type="text" value="${esc(p.headerTitle || 'PT NAURA LATHISA SEJAHTERA')}" required></div>
              <div class="form-group"><label>ALAMAT / SUB-JUDUL KOP</label><input id="pdfSub" type="text" value="${esc(p.headerSubtitle || 'Keuangan Properti, KPR & Operasional')}"></div>
              <div class="form-group"><label>NAMA DIREKTUR (ACC)</label><input id="pdfDir" type="text" value="${esc(DB.meta.directorName || 'Direktur Utama')}" required></div>
              <div class="form-group"><label>UPLOAD FILE LOGO KOP (OPSIONAL)</label><input type="file" accept="image/*" onchange="uploadCustomLogo(event)"></div>
            </div>
            <div class="actions-bar">
              <button type="submit" class="btn green">Simpan Kop & Template</button>
              <button type="button" class="btn" onclick="window.print()">Cetak Pratinjau PDF</button>
            </div>
          </form>
          ${printHead('Pratinjau Kop Surat Resmi')}
          ${directorSign()}
        </div>`;
    }

    function uploadCustomLogo(ev) {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        DB.meta.customLogoDataUrl = r.result;
        saveDB();
        mountLogos();
        showToast('Logo kop surat diperbarui.');
        renderView();
      };
      r.readAsDataURL(f);
    }

    function savePdfCfg(ev) {
      ev.preventDefault();
      DB.meta.pdf = {
        paperSize: document.getElementById('pdfPaper').value,
        orientation: document.getElementById('pdfOrient').value,
        headerTitle: (document.getElementById('pdfTitle').value || '').trim(),
        headerSubtitle: (document.getElementById('pdfSub').value || '').trim(),
        footerNote: (DB.meta.pdf && DB.meta.pdf.footerNote) || 'Dokumen sah apabila disetujui / ACC Direktur.'
      };
      DB.meta.directorName = (document.getElementById('pdfDir').value || '').trim() || 'Direktur Utama';
      saveDB();
      showToast('Template kop surat & nama Direktur tersimpan.');
      renderView();
    }

    /* ==================== DATABASE, AKSES MULTI-PERANGKAT & HOSTING GRATIS ==================== */
    function viewDatabase(fin) {
      return `
        <div class="panel">
          <div class="panel-head"><div><h3>Sinkronisasi Database Multi-Perangkat (HP & Laptop)</h3></div></div>
          <div class="form-grid">
            <div class="form-group full">
              <label>URL WEB APP GOOGLE APPS SCRIPT (/EXEC)</label>
              <input id="gasUrlField" type="url" value="${esc(DB.meta.gasUrl || '')}" placeholder="https://script.google.com/macros/s/....../exec" ${canEditSystem() ? '' : 'readonly'}>
            </div>
          </div>
          <div class="actions-bar">
            ${canEditSystem() ? `<button type="button" class="btn green" onclick="saveGas()">Simpan URL</button>` : ''}
            <button type="button" class="btn" onclick="syncFromCloud(true)">⟳ Sinkronkan Sekarang</button>
            <button type="button" class="btn ghost" onclick="exportJson()">⬇ Backup JSON</button>
            <button type="button" class="btn ghost" onclick="document.getElementById('importJsonFile').click()">⬆ Restore JSON</button>
            <input id="importJsonFile" type="file" accept=".json" class="hidden" onchange="importJson(event)">
            ${canEditSystem() ? `<button type="button" class="btn danger" onclick="resetAll()">↺ Reset Nol (Rp 0)</button>` : ''}
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><div><h3>Panduan Akses Database, HP/Laptop & Hosting Gratis</h3></div></div>
          <div class="summary-box" style="font-size:12.5px;line-height:1.75;">
            <b>1. Cara Mengakses Database Anda:</b><br>
            • <b>Google Sheets (Cloud):</b> Buat Google Sheet baru → buka <i>Extensions → Apps Script</i> → deploy sebagai Web App (<i>Anyone</i>) → tempelkan URL <code>/exec</code> di kolom di atas lalu klik <i>Simpan URL</i>.<br>
            • <b>File JSON Lokal:</b> Klik <i>Backup JSON</i> kapan saja untuk menyimpan salinan database ke komputer/HP, dan klik <i>Restore JSON</i> untuk memulihkannya.<br><br>
            <b>2. Cara Mengakses di HP & Laptop:</b><br>
            • Setelah di-hosting (lihat poin 3), buka link yang sama di browser HP maupun Laptop lalu login dengan akun masing-masing divisi.<br><br>
            <b>3. Cara Hosting Gratis Tanpa Berbayar:</b><br>
            • <b>GitHub Pages (Gratis):</b> Buat repository baru di GitHub → upload file <code>index.html</code> → masuk <i>Settings → Pages</i> → pilih branch <code>main</code> → simpan. Link publik gratis langsung aktif.<br>
            • <b>Netlify Drop (Gratis):</b> Buka <i>app.netlify.com/drop</i> → tarik/drag folder berisi <code>index.html</code> → website langsung online gratis.
          </div>
        </div>`;
    }

    function saveGas() {
      if (!canEditSystem()) return showToast('Khusus Developer.');
      DB.meta.gasUrl = (document.getElementById('gasUrlField').value || '').trim();
      saveDB();
      showToast('URL database tersimpan.');
    }

    async function syncFromCloud(notify) {
      const url = (DB.meta.gasUrl || '').trim();
      if (!url) {
        document.getElementById('syncStatus').textContent = 'Mode: Penyimpanan Lokal (Nominal Awal Rp 0)';
        if (notify) showToast('Mode penyimpanan lokal aktif.');
        return;
      }
      try {
        const res = await fetch(url + '?action=getAll');
        const json = await res.json();
        if (json && json.ok && json.data) {
          const keep = { gasUrl: DB.meta.gasUrl, pdf: DB.meta.pdf, directorName: DB.meta.directorName, customLogoDataUrl: DB.meta.customLogoDataUrl };
          DB = Object.assign({}, initialDB(), json.data);
          DB.meta = Object.assign({}, DB.meta, keep);
          saveDB();
          mountLogos();
          document.getElementById('syncStatus').textContent = 'Sinkron: Google Sheets';
          if (notify) { showToast('Data tersinkronkan.'); renderView(); }
        }
      } catch (e) {
        if (notify) showToast('Gagal terhubung ke URL Sheets, memakai data lokal.');
      }
    }

    async function pushCloud(action, payload) {
      const url = (DB.meta.gasUrl || '').trim();
      if (!url) return;
      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, payload, snapshot: DB })
        });
      } catch (e) {}
    }

    function fixJournalBalance() {
      if (!canEditFinance()) return showToast('Tidak ada hak memperbaiki jurnal.');
      const fin = calcFinance();
      const diff = fin.totalDebit - fin.totalKredit;
      if (Math.abs(diff) < 0.01) return showToast('Jurnal sudah seimbang.');
      if (diff > 0) {
        DB.journals.push({ id: 'J-FIX-' + Date.now(), tanggal: today(), bukti: 'FIX-AUTO', keterangan: 'Penyeimbang otomatis', kodeAkun: '3201', namaAkun: 'Saldo Laba Ditahan', debit: 0, kredit: diff });
      } else {
        DB.journals.push({ id: 'J-FIX-' + Date.now(), tanggal: today(), bukti: 'FIX-AUTO', keterangan: 'Penyeimbang otomatis', kodeAkun: '1101', namaAkun: 'Kas Operasional', debit: Math.abs(diff), kredit: 0 });
      }
      saveDB();
      showToast('Selisih jurnal berhasil diseimbangkan.');
      renderView();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'naura-finance-3d-' + today() + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJson(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const obj = JSON.parse(r.result);
          DB = Object.assign({}, initialDB(), obj);
          saveDB();
          mountLogos();
          showToast('Data JSON dipulihkan.');
          renderView();
        } catch (e) {
          showToast('File JSON tidak valid.');
        }
      };
      r.readAsText(file);
    }

    function resetAll() {
      if (!canEditSystem()) return showToast('Khusus Developer.');
      if (!confirm('Reset semua data ke nol (Rp 0)?')) return;
      const url = DB.meta.gasUrl;
      DB = initialDB();
      DB.meta.gasUrl = url;
      saveDB();
      showToast('Data direset ke Rp 0.');
      renderView();
    }

    /* ==================== PENGGUNA ==================== */
    function viewPengguna() {
      const users = DB.users || [];
      return `
        <div class="panel">
          <div class="panel-head">
            <div><h3>Daftar Pengguna & Divisi</h3></div>
            ${canManageUsers() ? `<button type="button" class="btn green no-print" onclick="openUserModal()">+ Tambah Pengguna</button>` : ''}
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nama</th><th>Username</th><th>Divisi / Peran</th></tr></thead>
              <tbody>
                ${users.map(u => `<tr><td>${esc(u.nama)}</td><td class="mono">${esc(u.username)}</td><td><span class="badge">${esc(u.role)}</span></td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function openUserModal() {
      if (!canManageUsers()) return showToast('Tidak ada hak menambah pengguna.');
      openModal(`
        <div class="panel-head">
          <h3>Tambah Akun Pengguna</h3>
          <button type="button" class="btn sm ghost" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="saveUserModal(event)">
          <div class="form-grid">
            <div class="form-group"><label>NAMA</label><input id="mUNama" type="text" required></div>
            <div class="form-group"><label>USERNAME</label><input id="mUUser" type="text" required></div>
            <div class="form-group"><label>PASSWORD</label><input id="mUPass" type="password" required></div>
            <div class="form-group">
              <label>DIVISI / PERAN</label>
              <select id="mURole">
                <option value="Tim Marketing">Tim Marketing</option>
                <option value="Tim Admin">Tim Admin</option>
                <option value="Direktur">Direktur</option>
                <option value="Owner">Owner</option>
                ${role() === 'Developer' ? `<option value="Developer">Developer</option>` : ''}
              </select>
            </div>
          </div>
          <div class="actions-bar">
            <button type="submit" class="btn green">Simpan Akun</button>
            <button type="button" class="btn ghost" onclick="closeModal()">Batal</button>
          </div>
        </form>`);
    }

    function saveUserModal(ev) {
      ev.preventDefault();
      if (!canManageUsers()) return showToast('Tidak ada hak menambah pengguna.');
      DB.users.push({
        id: 'U-' + Date.now(),
        nama: (document.getElementById('mUNama').value || '').trim(),
        username: (document.getElementById('mUUser').value || '').trim(),
        password: hashPass(document.getElementById('mUPass').value),
        role: document.getElementById('mURole').value
      });
      saveDB();
      closeModal();
      showToast('Akun baru ditambahkan.');
      renderView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      mountLogos();
      try {
        const s = JSON.parse(sessionStorage.getItem(SESS_KEY) || 'null');
        if (s && s.id) {
          const u = (DB.users || []).find(x => x.id === s.id);
          if (u) enterApp(u);
        }
      } catch (e) {}
    });
  </script>
